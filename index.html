<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purple Ruler · Allocator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f2f2f7;
  --sidebar: #e8e8ed;
  --panel: #ffffff;
  --border: rgba(60,60,67,0.12);
  --border-med: rgba(60,60,67,0.18);
  --t1: #1c1c1e;
  --t2: #3c3c43;
  --t3: #6c6c70;
  --t4: #aeaeb2;
  --accent: #007aff;
  --green: #28cd41;
  --green-dk: #1a9e33;
  --orange: #ff9f0a;
  --orange-dk: #b97300;
  --red: #ff3b30;
  --gray: #8e8e93;
  --row-hover: #f2f2f7;
  --sel: rgba(0,122,255,0.07);
  font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  font-size: 13px;
  color: var(--t1);
  -webkit-font-smoothing: antialiased;
}

body {
  background: var(--bg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top bar ──────────────────────────────────────────────────────────────── */
.topbar {
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(24px) saturate(200%);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
  color: var(--t1);
  letter-spacing: -0.2px;
  flex-shrink: 0;
}

.brand-mark {
  width: 20px;
  height: 20px;
  background: linear-gradient(135deg, #6c3ce1 0%, #4b6cf7 100%);
  border-radius: 6px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-mark svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 2; }

.topbar-sep {
  width: 1px;
  height: 18px;
  background: var(--border-med);
  flex-shrink: 0;
}

.search-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 480px;
}

.search-field {
  flex: 1;
  height: 28px;
  border: 1px solid var(--border-med);
  border-radius: 7px;
  background: var(--bg);
  padding: 0 10px;
  font: inherit;
  font-size: 13px;
  color: var(--t1);
  outline: none;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  letter-spacing: -0.1px;
}
.search-field::placeholder { color: var(--t4); }
.search-field:focus {
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
}

.topbar-info {
  font-size: 12px;
  color: var(--t3);
  margin-left: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 28px;
  padding: 0 14px;
  border-radius: 7px;
  border: none;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.1s, filter 0.1s, background 0.1s;
  white-space: nowrap;
  letter-spacing: -0.1px;
}
.btn:active:not(:disabled) { opacity: 0.75; }
.btn:disabled { opacity: 0.35; cursor: default; }

.btn-sm { height: 22px; padding: 0 11px; font-size: 12px; border-radius: 5px; }

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }

.btn-secondary { background: rgba(60,60,67,0.1); color: var(--t1); }
.btn-secondary:hover:not(:disabled) { background: rgba(60,60,67,0.16); }

.btn-green { background: var(--green); color: #fff; }
.btn-green:hover:not(:disabled) { filter: brightness(1.06); }

.btn-danger { background: rgba(255,59,48,0.1); color: var(--red); }
.btn-danger:hover:not(:disabled) { background: rgba(255,59,48,0.18); }

/* ── Body layout ──────────────────────────────────────────────────────────── */
.body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ──────────────────────────────────────────────────────────────── */
.sidebar {
  width: 224px;
  flex-shrink: 0;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-hdr {
  padding: 8px 12px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-hdr-label {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--t3);
}
.sidebar-hdr-count {
  font-size: 11px;
  color: var(--t4);
  font-variant-numeric: tabular-nums;
}

.sidebar-scroll { flex: 1; overflow-y: auto; padding: 4px 0; }

.class-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 12px;
  cursor: pointer;
  position: relative;
  transition: background 0.1s;
  user-select: none;
  -webkit-user-select: none;
}
.class-row:hover { background: rgba(60,60,67,0.06); }
.class-row.active { background: var(--panel); }
.class-row.active::before {
  content: '';
  position: absolute;
  left: 0; top: 7px; bottom: 7px;
  width: 3px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}

.sdot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.sdot-u { background: var(--gray); }
.sdot-r { background: var(--orange); }
.sdot-c { background: var(--green); }

.class-row-body { flex: 1; min-width: 0; }
.class-row-id {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--t1);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.1px;
}
.class-row-sub {
  font-size: 11px;
  color: var(--t3);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-empty {
  padding: 28px 14px;
  text-align: center;
  font-size: 12px;
  color: var(--t4);
  line-height: 1.6;
}

/* ── Main panel ───────────────────────────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--panel);
}

/* ── Empty / loading states ───────────────────────────────────────────────── */
.state-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 48px 32px;
}
.state-icon {
  font-size: 36px;
  line-height: 1;
  opacity: 0.2;
  color: var(--t1);
  margin-bottom: 4px;
}
.state-label { font-size: 15px; font-weight: 500; color: var(--t3); }
.state-sub { font-size: 12.5px; color: var(--t4); text-align: center; line-height: 1.5; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border-med);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
  margin-bottom: 4px;
}

/* ── Class header ─────────────────────────────────────────────────────────── */
.class-hdr {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  flex-shrink: 0;
}
.class-hdr-info { flex: 1; min-width: 0; }
.class-hdr-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--t1);
  letter-spacing: -0.5px;
  line-height: 1.15;
}
.class-hdr-meta {
  font-size: 12px;
  color: var(--t3);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.meta-sep { color: var(--t4); }

.class-hdr-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  padding-top: 2px;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge-u { background: rgba(142,142,147,0.13); color: var(--gray); }
.badge-r { background: rgba(255,159,10,0.13); color: var(--orange-dk); }
.badge-c { background: rgba(40,205,65,0.13); color: var(--green-dk); }

/* ── Assigned teacher banner ──────────────────────────────────────────────── */
.assigned-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(40,205,65,0.07);
  border-bottom: 1px solid rgba(40,205,65,0.15);
  padding: 9px 20px;
  flex-shrink: 0;
  animation: fadeIn 0.2s ease;
}
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6c3ce1, #007aff);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.assigned-name { font-size: 13px; font-weight: 600; color: var(--t1); }
.assigned-role { font-size: 11px; color: var(--t3); }

/* ── Candidate table ──────────────────────────────────────────────────────── */
.table-wrap { flex: 1; overflow-y: auto; overflow-x: auto; }

table.cand {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}

table.cand thead {
  position: sticky;
  top: 0;
  z-index: 5;
}

table.cand thead th {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 6px 10px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--t3);
  white-space: nowrap;
}

table.cand tbody tr {
  border-bottom: 1px solid rgba(60,60,67,0.06);
  transition: background 0.08s;
}
table.cand tbody tr:hover { background: var(--row-hover); }

table.cand tbody td {
  padding: 0 10px;
  height: 30px;
  vertical-align: middle;
  color: var(--t1);
}

.col-rank { width: 30px; text-align: right; color: var(--t4); font-size: 11px; padding-right: 6px !important; }
.col-name { min-width: 170px; max-width: 230px; font-weight: 500; letter-spacing: -0.1px; }
.col-cat  { width: 78px; }
.col-dbs  { width: 42px; text-align: center; }
.col-subj { width: 46px; text-align: center; }
.col-eff  { width: 90px; font-variant-numeric: tabular-nums; }
.col-days { width: 78px; font-variant-numeric: tabular-nums; }
.col-act  { width: 70px; text-align: right; padding-right: 14px !important; }

.cat-pill {
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  white-space: nowrap;
}
.cat-est  { background: rgba(40,205,65,0.11); color: var(--green-dk); }
.cat-dev  { background: rgba(255,159,10,0.11); color: var(--orange-dk); }
.cat-emer { background: rgba(255,59,48,0.10); color: #c0392b; }
.cat-unk  { background: rgba(142,142,147,0.11); color: var(--gray); }

.chk { color: var(--green); font-size: 13px; }
.x   { color: var(--t4); font-size: 12px; }

.score-cell {
  display: flex;
  align-items: center;
  gap: 0;
  position: relative;
  padding: 3px 0;
}
.score-bar-bg {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: rgba(0,122,255,0.07);
  border-radius: 3px;
  pointer-events: none;
}
.score-num { position: relative; z-index: 1; padding-left: 5px; }

.row-btn {
  opacity: 0;
  transition: opacity 0.12s;
}
tr:hover .row-btn { opacity: 1; }

/* ── Toast ────────────────────────────────────────────────────────────────── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.toast-wrap {
  position: fixed;
  bottom: 18px;
  right: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 100;
  pointer-events: none;
}
.toast {
  background: rgba(28,28,30,0.92);
  backdrop-filter: blur(16px);
  color: #fff;
  border-radius: 10px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.1px;
  line-height: 1.4;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.18s, transform 0.18s;
  pointer-events: auto;
  max-width: 300px;
}
.toast.show { opacity: 1; transform: none; }

/* ── Scrollbar ────────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(60,60,67,0.18); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(60,60,67,0.32); }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 12 12"><polyline points="2,10 6,2 10,10"/></svg>
    </div>
    Purple Ruler
  </div>
  <div class="topbar-sep"></div>
  <span style="font-size:12px;color:var(--t3);font-weight:500">Allocator</span>
  <div class="topbar-sep"></div>
  <div class="search-group">
    <input class="search-field" id="courseInput" type="text"
           placeholder="Course ID — e.g. ABBA-ST1-Y11-16092025"
           spellcheck="false" autocomplete="off" />
    <button class="btn btn-primary" id="loadBtn">Load</button>
  </div>
  <div class="topbar-info" id="topbarInfo"></div>
</div>

<!-- Body -->
<div class="body">
  <div class="sidebar">
    <div class="sidebar-hdr">
      <span class="sidebar-hdr-label">Classes</span>
      <span class="sidebar-hdr-count" id="classCount">—</span>
    </div>
    <div class="sidebar-scroll" id="classList">
      <div class="sidebar-empty">Load a course<br>to see classes</div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<!-- Toasts -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
(() => {
  // ── Bridge detection ───────────────────────────────────────────────────────
  // If running standalone (GitHub Pages, file://), use mock data.
  // If loaded inside Wix iframe (window.parent !== window), use postMessage bridge.
  const IS_MOCK = !window.parent || window.parent === window ||
                  new URLSearchParams(location.search).has('mock');

  // ── postMessage bridge (Wix mode) ─────────────────────────────────────────
  const BRIDGE_TIMEOUT = 30000;
  let _reqId = 1;
  const _pending = new Map();

  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || m.type !== 'result' || !m.reqId) return;
    const slot = _pending.get(m.reqId);
    if (!slot) return;
    clearTimeout(slot.timer);
    _pending.delete(m.reqId);
    m.ok ? slot.resolve(m.data) : slot.reject(new Error(m.error || 'Bridge error'));
  });

  function bridgeCall(method, ...args) {
    const reqId = `r${Date.now()}-${_reqId++}`;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        _pending.delete(reqId);
        reject(new Error(`Timeout: ${method}`));
      }, BRIDGE_TIMEOUT);
      _pending.set(reqId, { resolve, reject, timer });
      window.parent.postMessage({ type: 'call', reqId, method, args }, '*');
    });
  }

  // ── Mock data (GitHub Pages preview) ──────────────────────────────────────
  const MOCK = {
    course: {
      id: 'ABBA-ST1-Y11-16092025',
      name: 'Ark Bolingbroke — Year 11 — Term 4',
      timezone: 'GMT',
      classes: [
        { classId:'ABBA-ST1-Y11-ENGLISH-G1', subject:'English Language', weekday:'Wednesday', time:'08:15–08:45', instances:5, status:'Unassigned',  assignedTeacher:null },
        { classId:'ABBA-ST1-Y11-ENGLISH-G2', subject:'English Language', weekday:'Wednesday', time:'09:00–09:30', instances:5, status:'Reserved',    assignedTeacher:{ name:'Jessica M. Clarke',   larkId:'on_abc' } },
        { classId:'ABBA-ST1-Y11-MATHS-G1',   subject:'Mathematics',      weekday:'Thursday',  time:'14:00–14:30', instances:5, status:'Confirmed',   assignedTeacher:{ name:'Priya Nair',           larkId:'on_def' } },
        { classId:'ABBA-ST1-Y11-SCIENCE-G1', subject:'Physics',          weekday:'Monday',    time:'11:00–11:30', instances:5, status:'Unassigned',  assignedTeacher:null },
        { classId:'ABBA-ST1-Y11-HISTORY-G1', subject:'History',          weekday:'Tuesday',   time:'13:15–13:45', instances:4, status:'Unassigned',  assignedTeacher:null },
      ]
    },
    candidates: {
      'ABBA-ST1-Y11-ENGLISH-G1': [
        { rank:1, name:'Taryn Sandra Bennett',  larkId:'on_5bc44a3244119ceedac10a7c90cb030e', category:'Established', dbsOk:true,  subjOk:true,  effRem:47, daysAt:4 },
        { rank:2, name:'Michael O. Pryce',      larkId:'on_p02', category:'Established', dbsOk:true,  subjOk:true,  effRem:41, daysAt:3 },
        { rank:3, name:'Aisha Lowe-Okafor',     larkId:'on_p03', category:'Developing',  dbsOk:true,  subjOk:true,  effRem:38, daysAt:4 },
        { rank:4, name:'George Whitfield',      larkId:'on_p04', category:'Developing',  dbsOk:true,  subjOk:false, effRem:35, daysAt:2 },
        { rank:5, name:'Fiona A. Drummond',     larkId:'on_p05', category:'Emerging',    dbsOk:true,  subjOk:true,  effRem:29, daysAt:3 },
      ],
      default: [
        { rank:1, name:'Sample Teacher A', larkId:'on_s1', category:'Established', dbsOk:true,  subjOk:true,  effRem:44, daysAt:4 },
        { rank:2, name:'Sample Teacher B', larkId:'on_s2', category:'Developing',  dbsOk:true,  subjOk:true,  effRem:31, daysAt:3 },
        { rank:3, name:'Sample Teacher C', larkId:'on_s3', category:'Emerging',    dbsOk:false, subjOk:true,  effRem:22, daysAt:2 },
      ]
    }
  };

  function mockDelay(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ── API shim ───────────────────────────────────────────────────────────────
  async function api_loadCourse(courseId) {
    if (IS_MOCK) {
      await mockDelay(700);
      if (courseId.toUpperCase().trim() !== MOCK.course.id) throw new Error('Course not found');
      return MOCK.course;
    }
    return bridgeCall('loadCourse', courseId);
  }

  async function api_computeCandidates(classId) {
    if (IS_MOCK) {
      await mockDelay(1100);
      const list = MOCK.candidates[classId] || MOCK.candidates.default;
      return { classId, candidates: list };
    }
    return bridgeCall('computeCandidates', classId);
  }

  async function api_reserve(args) {
    if (IS_MOCK) { await mockDelay(500); return { ok: true }; }
    return bridgeCall('reserve', args);
  }
  async function api_confirm(args) {
    if (IS_MOCK) { await mockDelay(450); return { ok: true }; }
    return bridgeCall('confirm', args);
  }
  async function api_release(args) {
    if (IS_MOCK) { await mockDelay(450); return { ok: true }; }
    return bridgeCall('release', args);
  }

  // ── State ──────────────────────────────────────────────────────────────────
  // Designed for future multi-tab: courses Map + activeTabId.
  // For now only one course ever lives in the Map.
  const state = {
    courses: new Map(),      // courseId → { meta, classes[] }
    activeTabId: null,       // courseId of currently viewed course
    selectedClassId: null,
    candidates: [],
    loading: { course: false, candidates: false, action: false }
  };

  function activeCourse() { return state.courses.get(state.activeTabId) || null; }
  function activeClasses() { return activeCourse()?.classes || []; }
  function selectedClass() { return activeClasses().find(c => c.classId === state.selectedClassId) || null; }

  // ── Toast ──────────────────────────────────────────────────────────────────
  function toast(msg, ms = 3200) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.getElementById('toastWrap').appendChild(el);
    requestAnimationFrame(() => { el.classList.add('show'); });
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 220);
    }, ms);
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function statusKey(s) {
    return s === 'Reserved' ? 'r' : s === 'Confirmed' ? 'c' : 'u';
  }
  function dotClass(s) { return `sdot sdot-${statusKey(s)}`; }
  function badgeClass(s) { return `status-badge badge-${statusKey(s)}`; }

  function catPillHtml(cat) {
    const map = { Established:['est','Est'], Developing:['dev','Dev'], Emerging:['emer','Emer'] };
    const [cls, label] = map[cat] || ['unk', cat];
    return `<span class="cat-pill cat-${cls}">${label}</span>`;
  }

  function scoreBarHtml(val, max) {
    const pct = max > 0 ? Math.min(100, Math.round(val / max * 100)) : 0;
    return `<div class="score-cell" style="min-width:46px">
      <div class="score-bar-bg" style="width:${pct}%"></div>
      <span class="score-num">${val}</span>
    </div>`;
  }

  function initials(name) {
    return name.trim().split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
  }

  function shortClassId(classId) {
    // "ABBA-ST1-Y11-ENGLISH-G1" → "ENGLISH-G1"
    const parts = classId.split('-');
    return parts.length > 3 ? parts.slice(3).join('-') : classId;
  }

  // ── Render sidebar ─────────────────────────────────────────────────────────
  function renderSidebar() {
    const classes = activeClasses();
    const countEl = document.getElementById('classCount');
    const listEl  = document.getElementById('classList');

    if (!classes.length) {
      countEl.textContent = '—';
      listEl.innerHTML = '<div class="sidebar-empty">Load a course<br>to see classes</div>';
      return;
    }
    countEl.textContent = classes.length;
    listEl.innerHTML = classes.map(cls => {
      const active = cls.classId === state.selectedClassId;
      return `<div class="class-row${active ? ' active' : ''}" data-id="${cls.classId}">
        <div class="${dotClass(cls.status)}"></div>
        <div class="class-row-body">
          <div class="class-row-id">${shortClassId(cls.classId)}</div>
          <div class="class-row-sub">${cls.weekday} · ${cls.time}</div>
        </div>
      </div>`;
    }).join('');

    listEl.querySelectorAll('.class-row').forEach(el => {
      el.addEventListener('click', () => handleSelectClass(el.dataset.id));
    });
  }

  // ── Render main ────────────────────────────────────────────────────────────
  function renderMain() {
    const main = document.getElementById('main');

    if (!activeCourse()) {
      main.innerHTML = `<div class="state-view">
        <div class="state-icon">◎</div>
        <div class="state-label">No course loaded</div>
        <div class="state-sub">Enter a Course ID above and press Load</div>
      </div>`;
      return;
    }

    if (!state.selectedClassId) {
      main.innerHTML = `<div class="state-view">
        <div class="state-icon" style="font-size:28px">←</div>
        <div class="state-label">Select a class</div>
        <div class="state-sub">Choose a class from the sidebar<br>to see candidates</div>
      </div>`;
      return;
    }

    const cls = selectedClass();
    if (!cls) return;

    const sk = statusKey(cls.status);
    const shortId = shortClassId(cls.classId);

    // Action buttons in header
    let headerBtns = '';
    if (cls.status === 'Reserved') {
      headerBtns = `<button class="btn btn-green btn-sm" id="confirmBtn">Confirm</button>
                    <button class="btn btn-danger btn-sm" id="releaseBtn">Release</button>`;
    } else if (cls.status === 'Confirmed') {
      headerBtns = `<button class="btn btn-danger btn-sm" id="releaseBtn">Release</button>`;
    }

    // Assigned teacher banner
    let bannerHtml = '';
    if (cls.assignedTeacher && (cls.status === 'Reserved' || cls.status === 'Confirmed')) {
      const t = cls.assignedTeacher;
      const verb = cls.status === 'Confirmed' ? 'Confirmed teacher' : 'Reserved for';
      bannerHtml = `<div class="assigned-banner">
        <div class="avatar">${initials(t.name)}</div>
        <div>
          <div class="assigned-name">${t.name}</div>
          <div class="assigned-role">${verb}</div>
        </div>
      </div>`;
    }

    // Candidates area
    let candidatesHtml = '';
    if (state.loading.candidates) {
      candidatesHtml = `<div class="state-view">
        <div class="spinner"></div>
        <div class="state-sub">Computing candidates…</div>
      </div>`;
    } else if (!state.candidates.length) {
      candidatesHtml = `<div class="state-view">
        <div class="state-icon">∅</div>
        <div class="state-label">No candidates</div>
        <div class="state-sub">No teachers passed the hard filters<br>for this class</div>
      </div>`;
    } else {
      const maxEff  = Math.max(...state.candidates.map(c => c.effRem  || c.effectiveRem  || 0), 1);
      const maxDays = Math.max(...state.candidates.map(c => c.daysAt  || c.daysAtTime    || 0), 1);

      const rows = state.candidates.map(c => {
        const effVal  = c.effRem  ?? c.effectiveRem  ?? 0;
        const daysVal = c.daysAt  ?? c.daysAtTime    ?? 0;
        const reserveBtn = cls.status === 'Unassigned'
          ? `<button class="btn btn-primary btn-sm row-btn"
               data-lid="${c.larkId}" data-name="${c.name}">Reserve</button>`
          : '';
        return `<tr>
          <td class="col-rank">${c.rank}</td>
          <td class="col-name">${c.name}</td>
          <td class="col-cat">${catPillHtml(c.category)}</td>
          <td class="col-dbs">${c.dbsOk ? '<span class="chk">✓</span>' : '<span class="x">—</span>'}</td>
          <td class="col-subj">${(c.subjOk ?? c.subjectOk) ? '<span class="chk">✓</span>' : '<span class="x">—</span>'}</td>
          <td class="col-eff">${scoreBarHtml(effVal, maxEff)}</td>
          <td class="col-days">${scoreBarHtml(daysVal, maxDays)}</td>
          <td class="col-act">${reserveBtn}</td>
        </tr>`;
      }).join('');

      candidatesHtml = `<div class="table-wrap">
        <table class="cand">
          <thead>
            <tr>
              <th class="col-rank">#</th>
              <th class="col-name">Teacher</th>
              <th class="col-cat">Category</th>
              <th class="col-dbs">DBS</th>
              <th class="col-subj">Subj.</th>
              <th class="col-eff">Eff. Slots</th>
              <th class="col-days">Days @ Time</th>
              <th class="col-act"></th>
            </tr>
          </thead>
          <tbody id="candBody">${rows}</tbody>
        </table>
      </div>`;
    }

    main.innerHTML = `<div class="class-hdr">
        <div class="class-hdr-info">
          <div class="class-hdr-title">${shortId}</div>
          <div class="class-hdr-meta">
            <span>${cls.subject}</span>
            <span class="meta-sep">·</span>
            <span>${cls.weekday}, ${cls.time}</span>
            <span class="meta-sep">·</span>
            <span>${cls.instances} sessions</span>
            <span class="meta-sep">·</span>
            <span>${activeCourse()?.timezone || 'UTC'}</span>
          </div>
        </div>
        <div class="class-hdr-actions" id="hdrActions">
          <span class="${badgeClass(cls.status)}">${cls.status}</span>
          ${headerBtns}
        </div>
      </div>
      ${bannerHtml}
      ${candidatesHtml}`;

    wireMainEvents(cls);
  }

  function wireMainEvents(cls) {
    document.getElementById('main').querySelectorAll('.row-btn').forEach(btn => {
      btn.addEventListener('click', () =>
        doReserve(cls.classId, btn.dataset.lid, btn.dataset.name));
    });
    const confirmBtn = document.getElementById('confirmBtn');
    if (confirmBtn) confirmBtn.addEventListener('click', () => doConfirm(cls.classId));
    const releaseBtn = document.getElementById('releaseBtn');
    if (releaseBtn) releaseBtn.addEventListener('click', () => doRelease(cls.classId));
  }

  // ── Actions ────────────────────────────────────────────────────────────────
  async function doReserve(classId, larkId, teacherName) {
    if (state.loading.action) return;
    state.loading.action = true;
    try {
      await api_reserve({ classId, teacherLarkId: larkId, teacherName });
      const cls = activeClasses().find(c => c.classId === classId);
      if (cls) { cls.status = 'Reserved'; cls.assignedTeacher = { name: teacherName, larkId }; }
      toast(`Reserved — ${teacherName}`);
      renderSidebar();
      renderMain();
    } catch(e) {
      toast(`Reserve failed: ${e.message}`);
    } finally { state.loading.action = false; }
  }

  async function doConfirm(classId) {
    if (state.loading.action) return;
    state.loading.action = true;
    try {
      await api_confirm({ classId });
      const cls = activeClasses().find(c => c.classId === classId);
      if (cls) { cls.status = 'Confirmed'; }
      toast(`Confirmed — ${cls?.assignedTeacher?.name || ''}`);
      renderSidebar();
      renderMain();
    } catch(e) {
      toast(`Confirm failed: ${e.message}`);
    } finally { state.loading.action = false; }
  }

  async function doRelease(classId) {
    if (state.loading.action) return;
    state.loading.action = true;
    try {
      await api_release({ classId });
      const cls = activeClasses().find(c => c.classId === classId);
      const prev = cls?.assignedTeacher?.name;
      if (cls) { cls.status = 'Unassigned'; cls.assignedTeacher = null; }
      state.candidates = [];
      toast(`Released${prev ? ` — ${prev} removed` : ''}`);
      renderSidebar();
      renderMain();
    } catch(e) {
      toast(`Release failed: ${e.message}`);
    } finally { state.loading.action = false; }
  }

  // ── Load course ────────────────────────────────────────────────────────────
  async function handleLoadCourse() {
    const raw = document.getElementById('courseInput').value.trim();
    if (!raw) { toast('Enter a course ID first'); return; }
    if (state.loading.course) return;

    state.loading.course = true;
    document.getElementById('loadBtn').disabled = true;
    document.getElementById('topbarInfo').innerHTML =
      '<div class="spinner" style="display:inline-block"></div>';

    try {
      const data = await api_loadCourse(raw);
      // Deep-copy classes so status mutations don't affect cached meta
      const entry = {
        meta: { id: data.id, name: data.name, timezone: data.timezone },
        classes: JSON.parse(JSON.stringify(data.classes || []))
      };
      state.courses.set(data.id, entry);
      state.activeTabId = data.id;
      state.selectedClassId = null;
      state.candidates = [];
      document.getElementById('topbarInfo').textContent =
        `${entry.classes.length} classes · ${data.id}`;
      renderSidebar();
      renderMain();
    } catch(e) {
      document.getElementById('topbarInfo').textContent = '';
      toast(`Load failed: ${e.message}`);
    } finally {
      state.loading.course = false;
      document.getElementById('loadBtn').disabled = false;
    }
  }

  // ── Select class ───────────────────────────────────────────────────────────
  async function handleSelectClass(classId) {
    if (classId === state.selectedClassId) return;
    state.selectedClassId = classId;
    state.candidates = [];
    renderSidebar();
    renderMain();

    state.loading.candidates = true;
    renderMain();
    try {
      const result = await api_computeCandidates(classId);
      state.candidates = result?.candidates || result || [];
    } catch(e) {
      toast(`Candidates failed: ${e.message}`);
      state.candidates = [];
    } finally {
      state.loading.candidates = false;
      renderMain();
    }
  }

  // ── Wire top-level events ──────────────────────────────────────────────────
  document.getElementById('loadBtn').addEventListener('click', handleLoadCourse);
  document.getElementById('courseInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLoadCourse();
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  if (IS_MOCK) {
    document.getElementById('courseInput').value = 'ABBA-ST1-Y11-16092025';
    document.getElementById('topbarInfo').textContent = 'Preview mode';
  }
  renderMain();

  // Expose bridge helper for Wix page proxy (same API as before)
  window.bridge = { call: bridgeCall };

})();
</script>

</body>
</html>
