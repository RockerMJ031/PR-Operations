<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allocator</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:           #f2f2f7;
  --sidebar-bg:   #e8e8ed;
  --panel-bg:     #ffffff;
  --accent:       #007aff;
  --green:        #28cd41;
  --orange:       #ff9f0a;
  --red:          #ff3b30;
  --border:       rgba(60,60,67,0.12);
  --text:         #1c1c1e;
  --text2:        #3a3a3c;
  --text3:        #636366;
  --text4:        #8e8e93;
  --font:         -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  --radius:       8px;
  --bar-h:        44px;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
}

/* ── Top bar ──────────────────────────────────────────────── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--bar-h);
  background: rgba(242,242,247,0.72);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  backdrop-filter: blur(24px) saturate(200%);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 10px;
}
#topbar .app-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  letter-spacing: -0.2px; flex: 0 0 auto;
}
#topbar .mock-badge {
  font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
  text-transform: uppercase;
  background: var(--orange); color: #fff;
  padding: 1px 6px; border-radius: 20px;
  display: none;
}
#topbar .mock-badge.visible { display: inline-block; }

/* ── Layout ───────────────────────────────────────────────── */
#layout {
  display: flex;
  height: 100vh;
  padding-top: var(--bar-h);
}
#sidebar {
  width: 200px; flex: 0 0 200px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#main {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* ── Sidebar ──────────────────────────────────────────────── */
#sidebar-list {
  flex: 1; overflow-y: auto; padding: 8px 0;
}
.course-row {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  cursor: pointer; user-select: none;
  border-radius: 6px;
  margin: 0 4px;
  transition: background 0.12s;
}
.course-row:hover { background: rgba(0,0,0,0.05); }
.course-row.active { background: var(--accent); color: #fff; }
.course-row .cid {
  flex: 1; font-size: 12px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.course-row .dots { display: flex; gap: 3px; flex: 0 0 auto; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex: 0 0 7px;
}
.dot-red    { background: var(--red); }
.dot-orange { background: var(--orange); }
#sidebar-footer {
  flex: 0 0 auto;
  padding: 10px 8px;
  border-top: 1px solid var(--border);
}
#loadCoursesBtn {
  width: 100%;
  padding: 7px 12px;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font: 13px/1 var(--font);
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s;
}
#loadCoursesBtn:hover { opacity: 0.85; }
#loadCoursesBtn:disabled { opacity: 0.5; cursor: wait; }

/* ── Course Banner ────────────────────────────────────────── */
#course-banner {
  flex: 0 0 auto;
  padding: 12px 16px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border);
  display: none;
}
#course-banner.visible { display: block; }
#course-banner .banner-top {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
#course-banner .course-name {
  font-size: 15px; font-weight: 600; color: var(--text);
}
#course-banner .course-meta {
  font-size: 12px; color: var(--text3); margin-top: 3px;
}
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 7px;
  border-radius: 20px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.3px;
}
.badge-red    { background: rgba(255,59,48,0.12);  color: var(--red); }
.badge-orange { background: rgba(255,159,10,0.12); color: var(--orange); }

/* ── Split body ───────────────────────────────────────────── */
#split-body {
  flex: 1; display: flex; overflow: hidden;
}

/* ── Class overview (left 45%) ────────────────────────────── */
#overview-pane {
  width: 45%; flex: 0 0 45%;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#overview-pane .pane-head {
  flex: 0 0 auto;
  padding: 8px 12px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
  color: var(--text3); text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  background: var(--panel-bg);
}
#overview-list {
  flex: 1; overflow-y: auto;
  background: var(--panel-bg);
}
.class-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none;
  transition: background 0.1s;
  position: relative;
}
.class-row:last-child { border-bottom: none; }
.class-row:hover { background: rgba(0,122,255,0.04); }
.class-row.selected { background: rgba(0,122,255,0.08); }
.class-row .status-dot {
  width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px;
}
.status-dot.unassigned { background: #c7c7cc; }
.status-dot.reserved   { background: var(--orange); }
.status-dot.confirmed  { background: var(--green); }
.class-row .cls-info { flex: 1; min-width: 0; }
.class-row .cls-name {
  font-size: 12px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.class-row .cls-sched {
  font-size: 11px; color: var(--text3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.class-row .cls-assign {
  font-size: 11px; color: var(--text2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-top: 1px;
}
.class-row .cls-assign em {
  color: var(--text4); font-style: italic;
}
.class-row .conflict-icon {
  flex: 0 0 auto; font-size: 12px; color: var(--orange);
  visibility: hidden;
}
.class-row .conflict-icon.visible { visibility: visible; }

/* ── Candidate panel (right 55%) ─────────────────────────── */
#candidate-pane {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
  background: var(--panel-bg);
}
#candidate-pane .pane-head {
  flex: 0 0 auto;
  padding: 8px 12px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
  color: var(--text3); text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  background: var(--panel-bg);
}
#candidate-body {
  flex: 1; overflow-y: auto; padding: 12px;
}
.cand-placeholder {
  display: flex; align-items: center; justify-content: center;
  height: 120px;
  color: var(--text4); font-size: 13px;
}

/* Class header inside candidate panel */
.cand-class-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; flex-wrap: wrap;
}
.cand-class-name {
  font-size: 14px; font-weight: 600; color: var(--text);
}
.status-badge {
  font-size: 11px; font-weight: 600; padding: 2px 8px;
  border-radius: 20px;
}
.status-badge.unassigned { background: rgba(199,199,204,0.3); color: var(--text3); }
.status-badge.reserved   { background: rgba(255,159,10,0.15); color: #c67700; }
.status-badge.confirmed  { background: rgba(40,205,65,0.12);  color: #1a8f2d; }

/* Action buttons */
.action-row {
  display: flex; gap: 8px; margin-bottom: 10px;
}
.action-btn {
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font: 12px/1.4 var(--font); font-weight: 500;
  cursor: pointer;
  background: var(--panel-bg);
  transition: background 0.12s, opacity 0.12s;
}
.action-btn:hover { background: rgba(0,0,0,0.04); }
.action-btn:disabled { opacity: 0.45; cursor: wait; }
.action-btn.confirm { border-color: var(--green); color: var(--green); }
.action-btn.release { border-color: var(--red);   color: var(--red); }
.action-btn.confirm:hover { background: rgba(40,205,65,0.08); }
.action-btn.release:hover { background: rgba(255,59,48,0.06); }

/* Assigned teacher banner */
.assigned-banner {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  background: rgba(0,122,255,0.06);
  border: 1px solid rgba(0,122,255,0.14);
  border-radius: 6px;
  margin-bottom: 10px;
  font-size: 13px;
}
.assigned-banner .at-label { color: var(--text3); font-weight: 500; }
.assigned-banner .at-name  { color: var(--text);  font-weight: 600; }

/* LA-SEND notice */
.send-notice {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 10px;
  background: rgba(255,59,48,0.07);
  border: 1px solid rgba(255,59,48,0.15);
  border-radius: 6px;
  margin-bottom: 10px;
  font-size: 12px; color: var(--red); font-weight: 500;
}

/* Candidate table */
.cand-table {
  width: 100%; border-collapse: collapse;
  font-size: 12px;
}
.cand-table th {
  text-align: left;
  padding: 5px 8px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.4px;
  text-transform: uppercase; color: var(--text3);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.cand-table td {
  padding: 7px 8px;
  border-bottom: 1px solid rgba(60,60,67,0.07);
  vertical-align: middle;
}
.cand-table tr:last-child td { border-bottom: none; }
.cand-table tbody tr {
  transition: background 0.1s;
  position: relative;
}
.cand-table tbody tr:hover { background: rgba(0,122,255,0.04); }
.cand-table tbody tr:hover .reserve-btn { opacity: 1; }

/* Score bar */
.score-cell { position: relative; }
.score-bar {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: rgba(0,122,255,0.07);
  border-radius: 2px;
  z-index: 0;
}
.score-val {
  position: relative; z-index: 1;
  font-weight: 500;
}

/* Category pill */
.cat-pill {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 20px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
  text-transform: uppercase;
}
.cat-established { background: rgba(40,205,65,0.12);  color: #1a8f2d; }
.cat-developing  { background: rgba(255,159,10,0.12); color: #c67700; }
.cat-emerging    { background: rgba(255,59,48,0.1);   color: #b02218; }

/* Reserve button */
.reserve-btn {
  opacity: 0;
  padding: 3px 10px;
  border: 1px solid var(--accent);
  border-radius: 5px;
  background: rgba(0,122,255,0.06);
  color: var(--accent);
  font: 11px/1.4 var(--font); font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, background 0.12s;
  white-space: nowrap;
}
.reserve-btn:hover { background: rgba(0,122,255,0.12); }
.reserve-btn:disabled { opacity: 0.5 !important; cursor: wait; }

/* Teacher conflict warning */
.conflict-warn {
  font-size: 11px; color: var(--orange); margin-top: 2px;
}

/* DBS / Subj check */
.check-ok  { color: var(--green);  font-weight: 600; }
.check-no  { color: var(--red);    font-weight: 600; }

/* Spinner */
.spinner {
  display: inline-block;
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner-row {
  display: flex; align-items: center; gap: 8px;
  padding: 16px 0; color: var(--text3); font-size: 13px;
}

/* ── Toasts ───────────────────────────────────────────────── */
#toast-container {
  position: fixed; bottom: 20px; right: 20px;
  z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
  align-items: flex-end;
  pointer-events: none;
}
.toast {
  background: rgba(28,28,30,0.88);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  backdrop-filter: blur(16px) saturate(180%);
  color: #fff;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 13px; font-weight: 500;
  max-width: 320px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ── Empty states ─────────────────────────────────────────── */
.empty-msg {
  padding: 24px 12px;
  color: var(--text4); font-size: 13px; text-align: center;
}
</style>

<body>

<!-- Top bar -->
<div id="topbar">
  <div class="app-title">Allocator</div>

</div>

<!-- Main layout -->
<div id="layout">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-list">

</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
(() => {
'use strict';

/* ═══════════════════════════════════════════════════════════
   MOCK / BRIDGE detection
   ═══════════════════════════════════════════════════════════ */
const IS_MOCK = !window.parent || window.parent === window ||
                new URLSearchParams(location.search).has('mock');

if (IS_MOCK) {
  document.getElementById('mockBadge').classList.add('visible');
}

/* ═══════════════════════════════════════════════════════════
   MOCK DATA
   ═══════════════════════════════════════════════════════════ */
const MOCK = {};

MOCK.courses = [

];

MOCK.classes = {
  'ABBA-ST1-Y11-16092025': [
    { classId:'ABBA-ST1-Y11-ENGLISH-G1', subject:'English Language', weekday:'Wednesday', time:'08:15–08:45', instances:5, assignmentStatus:'Unassigned',  assignedTeacherName:'',                  assignedTeacherLarkId:'' },
    { classId:'ABBA-ST1-Y11-ENGLISH-G2', subject:'English Language', weekday:'Wednesday', time:'09:00–09:30', instances:5, assignmentStatus:'Reserved',   assignedTeacherName:'Jessica M. Clarke',  assignedTeacherLarkId:'on_abc' },
    { classId:'ABBA-ST1-Y11-MATHS-G1',   subject:'Mathematics',      weekday:'Thursday',  time:'14:00–14:30', instances:5, assignmentStatus:'Confirmed',  assignedTeacherName:'Priya Nair',         assignedTeacherLarkId:'on_def' },
    { classId:'ABBA-ST1-Y11-SCIENCE-G1', subject:'Physics',          weekday:'Monday',    time:'11:00–11:30', instances:5, assignmentStatus:'Unassigned',  assignedTeacherName:'',                  assignedTeacherLarkId:'' },
    { classId:'ABBA-ST1-Y11-HISTORY-G1', subject:'History',          weekday:'Tuesday',   time:'13:15–13:45', instances:4, assignmentStatus:'Unassigned',  assignedTeacherName:'',                  assignedTeacherLarkId:'' },
  ],
  'VPS-AP1-Y8-10122025': [
    { classId:'VPS-AP1-Y8-MATHS-G1',   subject:'Mathematics', weekday:'Monday',    time:'09:00–09:30', instances:6, assignmentStatus:'Unassigned', assignedTeacherName:'', assignedTeacherLarkId:'' },
    { classId:'VPS-AP1-Y8-ENGLISH-G1', subject:'English',     weekday:'Wednesday', time:'10:00–10:30', instances:6, assignmentStatus:'Unassigned', assignedTeacherName:'', assignedTeacherLarkId:'' },
  ],
  'KSA-ST2-Y10-15012026': [
    { classId:'KSA-ST2-Y10-MATHS-G1', subject:'Mathematics', weekday:'Friday', time:'09:15–09:45', instances:5, assignmentStatus:'Unassigned', assignedTeacherName:'', assignedTeacherLarkId:'' },

};

MOCK.candidates = {
  'ABBA-ST1-Y11-ENGLISH-G1': [
    { rank:1, name:'Taryn Sandra Bennett', larkId:'on_5bc44a32', category:'Established', dbsOk:true,  subjOk:true,  effRem:47, daysAt:4 },
    { rank:2, name:'Michael O. Pryce',     larkId:'on_p02',      category:'Established', dbsOk:true,  subjOk:true,  effRem:41, daysAt:3 },
    { rank:3, name:'Aisha Lowe-Okafor',    larkId:'on_p03',      category:'Developing',  dbsOk:true,  subjOk:true,  effRem:38, daysAt:4 },
    { rank:4, name:'George Whitfield',     larkId:'on_p04',      category:'Developing',  dbsOk:true,  subjOk:false, effRem:35, daysAt:2 },
    { rank:5, name:'Fiona A. Drummond',    larkId:'on_p05',      category:'Emerging',    dbsOk:true,  subjOk:true,  effRem:29, daysAt:3 },
  ],
  'ABBA-ST1-Y11-SCIENCE-G1': [
    { rank:1, name:'Taryn Sandra Bennett', larkId:'on_5bc44a32', category:'Established', dbsOk:true, subjOk:true, effRem:47, daysAt:3 },
    { rank:2, name:'Robert K. Singh',      larkId:'on_p06',      category:'Developing',  dbsOk:true, subjOk:true, effRem:33, daysAt:2 },
  ],
  _default: [
    { rank:1, name:'Alex Turner',   larkId:'on_d01', category:'Established', dbsOk:true,  subjOk:true,  effRem:44, daysAt:3 },
    { rank:2, name:'Maria Santos',  larkId:'on_d02', category:'Developing',  dbsOk:true,  subjOk:true,  effRem:37, daysAt:2 },
    { rank:3, name:'James Okafor',  larkId:'on_d03', category:'Developing',  dbsOk:false, subjOk:true,  effRem:31, daysAt:4 },

};

function mockDelay(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ═══════════════════════════════════════════════════════════
   BRIDGE
   ═══════════════════════════════════════════════════════════ */
const BRIDGE_TIMEOUT_MS = 30000;
const _pending = new Map();
let _nextReqId = 1;

function bridgeCall(method, ...args) {
  const reqId = `r${Date.now()}-${_nextReqId++}`;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      _pending.delete(reqId);
      reject(new Error(`Bridge timeout: ${method}`));
    }, BRIDGE_TIMEOUT_MS);
    _pending.set(reqId, { resolve, reject, timer });
    window.parent.postMessage({ type: 'call', reqId, method, args }, '*');
  });
}

window.addEventListener('message', (ev) => {
  const msg = ev.data;
  if (!msg || msg.type !== 'result' || !msg.reqId) return;
  const slot = _pending.get(msg.reqId);
  if (!slot) return;
  clearTimeout(slot.timer);
  _pending.delete(msg.reqId);
  if (msg.ok) slot.resolve(msg.data);
  else slot.reject(new Error(msg.error || 'Bridge error'));
});

/* ═══════════════════════════════════════════════════════════
   API SHIMS
   ═══════════════════════════════════════════════════════════ */
async function api_listCourses(limit) {
  if (IS_MOCK) {
    await mockDelay(500);
    return { ok: true, courses: MOCK.courses.slice(0, limit) };
  }
  return bridgeCall('listCourses', limit);
}

async function api_loadCourse(courseId) {
  if (IS_MOCK) {
    await mockDelay(700);
    const all = MOCK.courses;
    const course = all.find(c => c.courseId === courseId);
    if (!course) return { ok: false, error: 'Course not found' };
    return { ok: true, course, classes: MOCK.classes[courseId] || [] };
  }
  return bridgeCall('loadCourse', courseId);
}

async function api_computeCandidates(classId) {
  if (IS_MOCK) {
    await mockDelay(1100);
    const cands = MOCK.candidates[classId] || MOCK.candidates._default;
    return { ok: true, candidates: cands };
  }
  return bridgeCall('computeCandidates', classId);
}

async function api_reserve(classId, teacherLarkId, teacherName) {
  if (IS_MOCK) {
    await mockDelay(600);
    return { ok: true };
  }
  return bridgeCall('reserve', { classId, teacherLarkId, teacherName });
}

async function api_confirm(classId) {
  if (IS_MOCK) {
    await mockDelay(500);
    return { ok: true };
  }
  return bridgeCall('confirm', { classId });
}

async function api_release(classId) {
  if (IS_MOCK) {
    await mockDelay(500);
    return { ok: true };
  }
  return bridgeCall('release', { classId });
}

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
const state = {
  courses: [],
  activeCourseId: null,
  activeCourse: null,
  classes: [],
  selectedClassId: null,
  candidatesByClassId: new Map(),
  loading: { courses: false, course: false, candidates: false, action: false }
};

/* ═══════════════════════════════════════════════════════════
   CONFLICT DETECTION
   ═══════════════════════════════════════════════════════════ */
function computeConflicts() {
  // Gather top-5 larkIds for every Unassigned class that has loaded candidates
  const unassignedWithCands = state.classes.filter(cl =>
    cl.assignmentStatus === 'Unassigned' &&
    state.candidatesByClassId.has(cl.classId)
  );

  // teacher larkId → Set of classIds where they appear in top 5
  const teacherToClasses = new Map();
  for (const cl of unassignedWithCands) {
    const cands = state.candidatesByClassId.get(cl.classId) || [];
    cands.slice(0, 5).forEach(cd => {
      if (!teacherToClasses.has(cd.larkId)) teacherToClasses.set(cd.larkId, new Set());
      teacherToClasses.get(cd.larkId).add(cl.classId);
    });
  }

  // conflicted teacher larkIds (appear in 2+ classes)
  const conflictedTeachers = new Map(); // larkId → Set<classId>
  teacherToClasses.forEach((classIds, larkId) => {
    if (classIds.size >= 2) conflictedTeachers.set(larkId, classIds);
  });

  return conflictedTeachers; // Map<larkId, Set<classId>>
}

/* ═══════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════ */
function shortClassId(classId) {
  // Drop 3-segment prefix: "ABBA-ST1-Y11-ENGLISH-G1" → "ENGLISH-G1"
  const parts = classId.split('-');
  return parts.length > 3 ? parts.slice(3).join('-') : classId;
}

function catClass(category) {
  if (!category) return '';
  const k = category.toLowerCase();
  if (k === 'established') return 'cat-established';
  if (k === 'developing')  return 'cat-developing';
  if (k === 'emerging')    return 'cat-emerging';
  return '';
}

function effRem(cd) {
  return cd.effRem ?? cd.effectiveRem ?? 0;
}
function daysAt(cd) {
  return cd.daysAt ?? cd.daysAtTime ?? 0;
}

function statusClass(s) {
  if (s === 'Reserved')  return 'reserved';
  if (s === 'Confirmed') return 'confirmed';
  return 'unassigned';
}

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */
function toast(msg, duration = 3000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => el.classList.add('show'));
  });
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, duration);
}

/* ═══════════════════════════════════════════════════════════
   RENDER — sidebar
   ═══════════════════════════════════════════════════════════ */
function renderSidebar() {
  const list   = document.getElementById('sidebar-list');
  const empty  = document.getElementById('sidebar-empty');
  const btn    = document.getElementById('loadCoursesBtn');

  btn.disabled = state.loading.courses;
  btn.textContent = state.loading.courses ? 'Loading…' : 'Load courses';

  if (state.courses.length === 0) {
    empty.style.display = '';
    // remove any old rows
    list.querySelectorAll('.course-row').forEach(r => r.remove());
    return;
  }
  empty.style.display = 'none';

  // Rebuild
  list.querySelectorAll('.course-row').forEach(r => r.remove());
  for (const c of state.courses) {
    const row = document.createElement('div');
    row.className = 'course-row' + (c.courseId === state.activeCourseId ? ' active' : '');
    row.dataset.courseId = c.courseId;

    const cid = document.createElement('span');
    cid.className = 'cid';
    cid.textContent = c.courseId;

    const dots = document.createElement('span');
    dots.className = 'dots';
    if (c.sendFlag) {
      const d = document.createElement('span');
      d.className = 'dot dot-red';
      d.title = 'LA-SEND';
      dots.appendChild(d);
    }
    if (c.behaviourFlag) {
      const d = document.createElement('span');
      d.className = 'dot dot-orange';
      d.title = 'Behaviour flag';
      dots.appendChild(d);
    }

    row.appendChild(cid);
    row.appendChild(dots);
    row.addEventListener('click', () => onSelectCourse(c.courseId));
    list.appendChild(row);
  }
}

/* ═══════════════════════════════════════════════════════════
   RENDER — course banner
   ═══════════════════════════════════════════════════════════ */
function renderBanner() {
  const banner = document.getElementById('course-banner');
  if (!state.activeCourse) {
    banner.classList.remove('visible');
    return;
  }
  banner.classList.add('visible');
  const c = state.activeCourse;
  document.getElementById('banner-name').textContent = c.courseId;
  document.getElementById('banner-meta').textContent =
    `${c.school} · ${c.yearGroup} · ${c.termInfo}`;
  const sendBadge = document.getElementById('banner-send');
  const behBadge  = document.getElementById('banner-beh');
  sendBadge.style.display = c.sendFlag      ? '' : 'none';
  behBadge.style.display  = c.behaviourFlag ? '' : 'none';
}

/* ═══════════════════════════════════════════════════════════
   RENDER — class overview
   ═══════════════════════════════════════════════════════════ */
function renderOverview() {
  const listEl = document.getElementById('overview-list');
  const emptyEl = document.getElementById('overview-empty');

  listEl.querySelectorAll('.class-row').forEach(r => r.remove());

  if (state.classes.length === 0) {
    emptyEl.style.display = '';
    return;
  }
  emptyEl.style.display = 'none';

  const conflicts = computeConflicts(); // Map<larkId, Set<classId>>
  // Which classIds are conflicted?
  const conflictedClassIds = new Set();
  conflicts.forEach((classIds) => classIds.forEach(cid => conflictedClassIds.add(cid)));

  for (const cl of state.classes) {
    const row = document.createElement('div');
    row.className = 'class-row' + (cl.classId === state.selectedClassId ? ' selected' : '');
    row.dataset.classId = cl.classId;

    // status dot
    const dot = document.createElement('span');
    dot.className = 'status-dot ' + statusClass(cl.assignmentStatus);
    row.appendChild(dot);

    // info block
    const info = document.createElement('div');
    info.className = 'cls-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'cls-name';
    nameEl.textContent = shortClassId(cl.classId);
    info.appendChild(nameEl);

    const schedEl = document.createElement('div');
    schedEl.className = 'cls-sched';
    schedEl.textContent = `${cl.weekday} ${cl.time} · ${cl.instances}×`;
    info.appendChild(schedEl);

    const assignEl = document.createElement('div');
    assignEl.className = 'cls-assign';
    if (cl.assignmentStatus === 'Reserved' || cl.assignmentStatus === 'Confirmed') {
      assignEl.textContent = cl.assignedTeacherName || '—';
    } else if (state.candidatesByClassId.has(cl.classId)) {
      const cands = state.candidatesByClassId.get(cl.classId);
      if (cands.length > 0) {
        const preview = cands.slice(0, 2).map(cd => cd.name.split(' ')[0]).join(', ');
        const em = document.createElement('em');
        em.textContent = preview + (cands.length > 2 ? '…' : '');
        assignEl.appendChild(em);
      } else {
        const em = document.createElement('em');
        em.textContent = 'No candidates';
        assignEl.appendChild(em);
      }
    } else {
      const em = document.createElement('em');
      em.textContent = 'click to load';
      assignEl.appendChild(em);
    }
    info.appendChild(assignEl);

    row.appendChild(info);

    // conflict icon
    const icon = document.createElement('span');
    icon.className = 'conflict-icon' + (conflictedClassIds.has(cl.classId) ? ' visible' : '');
    icon.title = 'Teacher conflict detected';
    icon.textContent = '⚠';
    row.appendChild(icon);

    row.addEventListener('click', () => onSelectClass(cl.classId));
    listEl.appendChild(row);
  }
}

/* ═══════════════════════════════════════════════════════════
   RENDER — candidate panel
   ═══════════════════════════════════════════════════════════ */
function renderCandidates() {
  const body = document.getElementById('candidate-body');
  const placeholder = document.getElementById('cand-placeholder');

  // clear body (preserve placeholder)
  Array.from(body.children).forEach(el => {
    if (el !== placeholder) el.remove();
  });

  if (!state.selectedClassId) {
    placeholder.style.display = '';
    return;
  }
  placeholder.style.display = 'none';

  const cl = state.classes.find(c => c.classId === state.selectedClassId);
  if (!cl) return;

  const conflicts = computeConflicts();

  // --- Class header ---
  const header = document.createElement('div');
  header.className = 'cand-class-header';

  const cname = document.createElement('span');
  cname.className = 'cand-class-name';
  cname.textContent = shortClassId(cl.classId);
  header.appendChild(cname);

  const statusBadge = document.createElement('span');
  statusBadge.className = 'status-badge ' + statusClass(cl.assignmentStatus);
  statusBadge.textContent = cl.assignmentStatus;
  header.appendChild(statusBadge);

  body.appendChild(header);

  // --- Action row (Confirm / Release) if Reserved or Confirmed ---
  if (cl.assignmentStatus === 'Reserved' || cl.assignmentStatus === 'Confirmed') {
    const actionRow = document.createElement('div');
    actionRow.className = 'action-row';

    if (cl.assignmentStatus === 'Reserved') {
      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'action-btn confirm';
      confirmBtn.textContent = 'Confirm';
      confirmBtn.disabled = state.loading.action;
      confirmBtn.addEventListener('click', () => onConfirm(cl.classId));
      actionRow.appendChild(confirmBtn);
    }

    const releaseBtn = document.createElement('button');
    releaseBtn.className = 'action-btn release';
    releaseBtn.textContent = 'Release';
    releaseBtn.disabled = state.loading.action;
    releaseBtn.addEventListener('click', () => onRelease(cl.classId));
    actionRow.appendChild(releaseBtn);

    body.appendChild(actionRow);
  }

  // --- Assigned teacher banner ---
  if (cl.assignmentStatus !== 'Unassigned' && cl.assignedTeacherName) {
    const banner = document.createElement('div');
    banner.className = 'assigned-banner';
    const lbl = document.createElement('span');
    lbl.className = 'at-label';
    lbl.textContent = cl.assignmentStatus === 'Confirmed' ? 'Confirmed:' : 'Reserved:';
    const nm = document.createElement('span');
    nm.className = 'at-name';
    nm.textContent = cl.assignedTeacherName;
    banner.appendChild(lbl);
    banner.appendChild(nm);
    body.appendChild(banner);
  }

  // --- LA-SEND notice ---
  if (state.activeCourse && state.activeCourse.sendFlag) {
    const notice = document.createElement('div');
    notice.className = 'send-notice';
    notice.innerHTML = '<strong>⚡ LA-SEND</strong>&nbsp;This course requires a SEND-qualified teacher.';
    body.appendChild(notice);
  }

  // --- Loading spinner ---
  if (state.loading.candidates && !state.candidatesByClassId.has(cl.classId)) {
    const row = document.createElement('div');
    row.className = 'spinner-row';
    const sp = document.createElement('span');
    sp.className = 'spinner';
    row.appendChild(sp);
    row.appendChild(document.createTextNode('Loading candidates…'));
    body.appendChild(row);
    return;
  }

  // --- Candidates table ---
  const cands = state.candidatesByClassId.get(cl.classId);
  if (!cands) {
    const msg = document.createElement('div');
    msg.className = 'cand-placeholder';
    msg.textContent = 'Candidates not loaded yet';
    body.appendChild(msg);
    return;
  }
  if (cands.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'cand-placeholder';
    msg.textContent = 'No candidates found';
    body.appendChild(msg);
    return;
  }

  // Build conflict info for inline warnings
  // For each teacher in this class's candidates, which OTHER classes are they conflicted with?
  const conflictInfo = new Map(); // larkId → array of other classId short names
  conflicts.forEach((classIds, larkId) => {
    const others = Array.from(classIds).filter(cid => cid !== cl.classId);
    if (others.length > 0 && classIds.has(cl.classId)) {
      conflictInfo.set(larkId, others.map(shortClassId));
    }
  });

  // Max effRem for score bar scaling
  const maxEff = Math.max(...cands.map(effRem), 1);

  const tbl = document.createElement('table');
  tbl.className = 'cand-table';

  // Header
  const thead = document.createElement('thead');
  thead.innerHTML = `<tr>
    <th>#</th>
    <th>Teacher</th>
    <th>Cat</th>
    <th>DBS</th>
    <th>Subj</th>
    <th>Eff Slots</th>
    <th>Days@Time</th>
    <th></th>
  </tr>`;
  tbl.appendChild(thead);

  const tbody = document.createElement('tbody');
  cands.forEach(cd => {
    const tr = document.createElement('tr');

    // rank
    const tdRank = document.createElement('td');
    tdRank.textContent = cd.rank;
    tdRank.style.color = 'var(--text3)';
    tdRank.style.fontWeight = '600';
    tr.appendChild(tdRank);

    // name + conflict warning
    const tdName = document.createElement('td');
    const nameDiv = document.createElement('div');
    nameDiv.style.fontWeight = '500';
    nameDiv.textContent = cd.name;
    tdName.appendChild(nameDiv);
    if (conflictInfo.has(cd.larkId)) {
      const warn = document.createElement('div');
      warn.className = 'conflict-warn';
      warn.textContent = '⚠ Also top for ' + conflictInfo.get(cd.larkId).join(', ');
      tdName.appendChild(warn);
    }
    tr.appendChild(tdName);

    // category
    const tdCat = document.createElement('td');
    const pill = document.createElement('span');
    pill.className = 'cat-pill ' + catClass(cd.category);
    pill.textContent = cd.category ? cd.category.substring(0, 3).toUpperCase() : '?';
    tdCat.appendChild(pill);
    tr.appendChild(tdCat);

    // DBS
    const tdDbs = document.createElement('td');
    tdDbs.innerHTML = cd.dbsOk
      ? '<span class="check-ok">&#10003;</span>'
      : '<span class="check-no">&#10007;</span>';
    tr.appendChild(tdDbs);

    // Subj
    const tdSubj = document.createElement('td');
    tdSubj.innerHTML = cd.subjOk
      ? '<span class="check-ok">&#10003;</span>'
      : '<span class="check-no">&#10007;</span>';
    tr.appendChild(tdSubj);

    // Eff Slots (with score bar)
    const tdEff = document.createElement('td');
    tdEff.className = 'score-cell';
    tdEff.style.position = 'relative';
    const bar = document.createElement('div');
    bar.className = 'score-bar';
    bar.style.width = (effRem(cd) / maxEff * 100).toFixed(1) + '%';
    const val = document.createElement('span');
    val.className = 'score-val';
    val.textContent = effRem(cd);
    tdEff.appendChild(bar);
    tdEff.appendChild(val);
    tr.appendChild(tdEff);

    // Days @ Time
    const tdDays = document.createElement('td');
    tdDays.textContent = daysAt(cd);
    tr.appendChild(tdDays);

    // Reserve button
    const tdBtn = document.createElement('td');
    if (cl.assignmentStatus === 'Unassigned' && !state.loading.action) {
      const btn = document.createElement('button');
      btn.className = 'reserve-btn';
      btn.textContent = 'Reserve';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        onReserve(cl.classId, cd.larkId, cd.name);
      });
      tdBtn.appendChild(btn);
    }
    tr.appendChild(tdBtn);

    tbody.appendChild(tr);
  });

  tbl.appendChild(tbody);
  body.appendChild(tbl);
}

/* ═══════════════════════════════════════════════════════════
   FULL RENDER
   ═══════════════════════════════════════════════════════════ */
function render() {
  renderSidebar();
  renderBanner();
  renderOverview();
  renderCandidates();
}

/* ═══════════════════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════════════════ */

// Load courses
async function onLoadCourses() {
  if (state.loading.courses) return;
  state.loading.courses = true;
  render();
  try {
    const res = await api_listCourses(50);
    if (!res.ok) { toast('Failed to load courses: ' + (res.error || 'Unknown error')); return; }
    state.courses = res.courses || [];
  } catch (err) {
    toast('Error: ' + err.message);
  } finally {
    state.loading.courses = false;
    render();
  }
}

// Select course
async function onSelectCourse(courseId) {
  if (state.loading.course) return;
  if (state.activeCourseId === courseId) return;

  const prevCourseId = state.activeCourseId;
  state.activeCourseId = courseId;
  state.activeCourse = null;
  state.classes = [];
  state.selectedClassId = null;
  state.candidatesByClassId.clear();
  state.loading.course = true;
  render();

  try {
    const res = await api_loadCourse(courseId);
    if (!res.ok) { toast('Failed to load course: ' + (res.error || 'Unknown')); return; }
    state.activeCourse = res.course;
    state.classes = (res.classes || []).map(cl => ({ ...cl })); // mutable copy
  } catch (err) {
    state.activeCourseId = prevCourseId;
    toast('Error: ' + err.message);
  } finally {
    state.loading.course = false;
    render();
  }
}

// Select class (and load candidates if not cached)
async function onSelectClass(classId) {
  state.selectedClassId = classId;
  render();

  if (!state.candidatesByClassId.has(classId)) {
    state.loading.candidates = true;
    render();
    try {
      const res = await api_computeCandidates(classId);
      if (!res.ok) { toast('Failed to load candidates: ' + (res.error || 'Unknown')); return; }
      state.candidatesByClassId.set(classId, res.candidates || []);
    } catch (err) {
      toast('Error: ' + err.message);
    } finally {
      state.loading.candidates = false;
      render();
    }
  }
}

// Reserve
async function onReserve(classId, teacherLarkId, teacherName) {
  if (state.loading.action) return;
  state.loading.action = true;
  render();
  try {
    const res = await api_reserve(classId, teacherLarkId, teacherName);
    if (!res.ok) { toast('Reserve failed: ' + (res.error || 'Unknown')); return; }
    const cl = state.classes.find(c => c.classId === classId);
    if (cl) {
      cl.assignmentStatus = 'Reserved';
      cl.assignedTeacherName = teacherName;
      cl.assignedTeacherLarkId = teacherLarkId;
    }
    toast('Reserved — ' + teacherName);
  } catch (err) {
    toast('Error: ' + err.message);
  } finally {
    state.loading.action = false;
    render();
  }
}

// Confirm
async function onConfirm(classId) {
  if (state.loading.action) return;
  state.loading.action = true;
  render();
  try {
    const res = await api_confirm(classId);
    if (!res.ok) { toast('Confirm failed: ' + (res.error || 'Unknown')); return; }
    const cl = state.classes.find(c => c.classId === classId);
    if (cl) cl.assignmentStatus = 'Confirmed';
    toast('Confirmed — ' + (cl ? cl.assignedTeacherName : classId));
  } catch (err) {
    toast('Error: ' + err.message);
  } finally {
    state.loading.action = false;
    render();
  }
}

// Release
async function onRelease(classId) {
  if (state.loading.action) return;
  state.loading.action = true;
  render();
  try {
    const res = await api_release(classId);
    if (!res.ok) { toast('Release failed: ' + (res.error || 'Unknown')); return; }
    const cl = state.classes.find(c => c.classId === classId);
    const prevName = cl ? cl.assignedTeacherName : classId;
    if (cl) {
      cl.assignmentStatus = 'Unassigned';
      cl.assignedTeacherName = '';
      cl.assignedTeacherLarkId = '';
    }
    toast('Released — ' + prevName + ' removed');
  } catch (err) {
    toast('Error: ' + err.message);
  } finally {
    state.loading.action = false;
    render();
  }
}

/* ═══════════════════════════════════════════════════════════
   BOOTSTRAP
   ═══════════════════════════════════════════════════════════ */
document.getElementById('loadCoursesBtn').addEventListener('click', onLoadCourses);

render(); // initial empty render

})();
</script>
</body>
